<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a7046" />
    <title>Management — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0c1a13; text-align: center;
        background: linear-gradient(160deg, #d3eedf 0%, #eef8f2 32%, #fff 70%); padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 24px; font-weight: 600; margin: 24px 0 8px; }
      p { color: #4d6358; line-height: 1.5; max-width: 320px; margin: 0 auto 24px; }
      button { background: #1a7046; color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Management needs an internet connection to load the latest figures.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
